baseURL = "https://yangzuozhi.github.io/chuanwu/"
title = "语音博客"
hasCJKLanguage = true
defaultContentLanguage = "zh"
paginate = 10
enableRobotsTXT = true

[params]
  env = "production"
  title = "语音博客"
  description = "这里的每篇文章，都来自一段语音。"
  DateFormat = "2006年1月2日"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  showtoc = false
  tocopen = false
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  comments = false

[params.cover]
  linkFullImages = true

[params.homeInfoParams]
  Title = "语音博客 📝"
  Content = "这里的每篇文章，都来自一段语音。\n\n拿起手机，随时记录，语音自动成文。"

[[params.socialIcons]]
  name = "RSS"
  url = "index.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[minify]
  disableXML = true
  minifyOutput = true

[[menu.main]]
  name = "归档"
  url = "archives/"
  weight = 5
[[menu.main]]
  name = "标签"
  url = "tags/"
  weight = 10
